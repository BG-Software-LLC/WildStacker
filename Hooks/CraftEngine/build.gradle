group 'Hooks:CraftEngine'

repositories {
    maven {
        url 'https://repo.momirealms.net/releases/'
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

dependencies {
    compileOnly 'net.momirealms:craft-engine-bukkit:0.0.51'
    compileOnly 'net.momirealms:craft-engine-core:0.0.51'
    compileOnly "org.spigotmc:v1_8_R3-Taco:latest"
    compileOnly project(":API")
    compileOnly project(":")
}

if (project.hasProperty('hook.compile_craftengine') &&
        !Boolean.valueOf(project.findProperty("hook.compile_craftengine").toString())) {
    project.tasks.all { task -> task.enabled = false }
}
