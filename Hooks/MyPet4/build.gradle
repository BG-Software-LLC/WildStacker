group 'Hooks:MyPet4'

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

repositories {
    maven { url 'https://repo.userderezzed.dev/snapshots' }
}

dependencies {
    compileOnly 'de.keyle:mypet-api:4.0.1-SNAPSHOT'
    compileOnly "org.spigotmc:v1_16_R3-Tuinity:latest"
    compileOnly project(":API")
    compileOnly project(":")
}

if (project.hasProperty('hook.compile_mypet4') &&
        !Boolean.valueOf(project.findProperty("hook.compile_mypet4").toString())) {
    project.tasks.all { task -> task.enabled = false }
}