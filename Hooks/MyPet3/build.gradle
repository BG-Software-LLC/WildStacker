group 'Hooks:MyPet3'

dependencies {
    compileOnly 'de.keyle:MyPet:3.9'
    compileOnly "org.spigotmc:v1_8_R3-Taco:latest"
    compileOnly project(":API")
    compileOnly project(":")
}

if (project.hasProperty('hook.compile_mypet3') &&
        !Boolean.valueOf(project.findProperty("hook.compile_mypet3").toString())) {
    project.tasks.all { task -> task.enabled = false }
}