group 'NMS'

subprojects {
    def generatedSrcDir = layout.buildDirectory.dir("generated/sources/nms")
    def propertiesFile = file("properties")
    def templatesDir = rootProject.file("NMS/src/main/templates")
    def templates = fileTree(templatesDir) {
        include '**/*.template'
    }

    def generateNmsSources = tasks.register('generateNmsSources') {
        inputs.files(templates).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('templates')
        inputs.files(propertiesFile).withPathSensitivity(PathSensitivity.NONE).withPropertyName('properties')
        outputs.dir(generatedSrcDir).withPropertyName('generatedSources')
        outputs.cacheIf { true }

        doLast {
            File outputDir = generatedSrcDir.get().asFile
            outputDir.deleteDir()
            outputDir.mkdirs()

            if (!propertiesFile.exists()) {
                return
            }

            def props = new Properties()
            propertiesFile.withInputStream { stream ->
                props.load(stream)
            }

            templates.visit { FileVisitDetails details ->
                if (details.directory)
                    return

                def relativePath = details.relativePath.pathString
                def outputFile = new File(outputDir, relativePath.replace('.template', ''))
                outputFile.parentFile.mkdirs()

                def templateText = details.file.text
                props.each { k, v ->
                    templateText = templateText.replace("\${${k}}", v)
                }
                outputFile.text = templateText
            }
        }
    }

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java']
                srcDir(generateNmsSources)
            }
        }
    }

}